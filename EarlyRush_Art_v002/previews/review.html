<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early Rush · 地图美术 v002</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#244d4a;font:16px/1.6 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:32px;margin:0}h2{font-size:21px;margin-top:32px}p{margin:8px 0 20px}.sub{color:#657b74}.notice{border-left:4px solid #d8ad54;background:#fffaf1;padding:12px 18px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}label{display:flex;align-items:center;gap:8px}select,a.button{font:inherit;border:1px solid #b5c0b6;background:#fffaf1;color:inherit;padding:7px 12px;border-radius:5px}a{color:#245c58}figure{margin:0}img{max-width:100%;height:auto;display:block;background:#f4f0e6}#map{margin:auto;max-height:80vh;object-fit:contain}.map-frame{background:#e9e7dc;border:1px solid #d7d5c8;padding:8px}figcaption{font-size:14px;color:#657b74;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.grid a{display:block}footer{margin:32px 0 8px;color:#657b74;font-size:14px}@media(max-width:760px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:25px}}
</style>
<main>
<h1>Early Rush · 地图美术 v002</h1>
<p class="sub">街道 / 地铁 / 办公室 · 34项资源 · 33项新生成，1项沿用</p>
<p class="notice">沿用现有关卡布局。以下是按真实地图数据拼装的离线预览，尚未导入Unity或完成实机验收。26项使用已有锚点；8项需要中心锚点或分区映射。</p>
<div class="controls">
<label>场景 <select id="stage"><option value="0">街道</option><option value="1">地铁</option><option value="2">办公室</option></select></label>
<label>查看 <select id="view"><option value="detail">任务区域近景</option><option value="overview">完整布局总览</option><option value="exit">出口区域近景</option></select></label>
<a id="full" class="button" href="map-stage-0-detail.png" target="_blank">打开原图</a>
</div>
<figure class="map-frame"><img id="map" src="map-stage-0-detail.png" alt="街道任务区域美术拼装预览"></figure>
<figcaption>Seed 91026。总览路线与任务文字仅为审片标记；奶油底为审片背景。动态人流与全部任务状态没有重现，列车展示静态开门图；人物位于尺寸参照栏。</figcaption>
<h2>模块素材</h2>
<div class="grid">
<figure><a href="assets-street.png" target="_blank"><img src="assets-street.png" alt="10项街道模块素材"></a><figcaption>街道：店面、入口、家具植栽与地面标记</figcaption></figure>
<figure><a href="assets-metro.png" target="_blank"><img src="assets-metro.png" alt="9项地铁模块素材"></a><figcaption>地铁：列车开闭、站厅与站台设施</figcaption></figure>
<figure><a href="assets-office.png" target="_blank"><img src="assets-office.png" alt="7项办公室模块素材"></a><figcaption>办公室：空工位、文件柜与办公家具</figcaption></figure>
<figure><a href="assets-common.png" target="_blank"><img src="assets-common.png" alt="8项地面和共用设施"></a><figcaption>共用：地面、早餐摊、导航与中性框</figcaption></figure>
</div>
<h2>地面重复检查</h2><a href="floors-repeat.png" target="_blank"><img src="floors-repeat.png" alt="五种地面各自2乘2重复预览"></a>
<footer>详细接入边界与提示词索引见 <a href="../README.md">交付说明</a>。源图为单层PNG；未交付分层母版、独立门叶和全部新增接口扩展素材。</footer>
</main>
<script>
const stage=document.querySelector('#stage'),view=document.querySelector('#view'),map=document.querySelector('#map'),full=document.querySelector('#full');
function update(){const path=`map-stage-${stage.value}-${view.value}.png`;map.src=path;full.href=path;map.alt=stage.options[stage.selectedIndex].text+' / '+view.options[view.selectedIndex].text+'美术拼装预览'}
stage.addEventListener('change',update);view.addEventListener('change',update);
</script>
</html>
